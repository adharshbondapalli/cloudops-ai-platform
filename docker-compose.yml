services:
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8001:8000"
    networks:
      - cloudops-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8003:8000"
    networks:
      - cloudops-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8002:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
    depends_on:
      - product-service
      - payment-service
    networks:
      - cloudops-network

networks:
  cloudops-network:
    driver: bridge
